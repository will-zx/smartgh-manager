  <text x="1330" y="837" font-size="12" font-weight="700" class="blue">1.00 kPa</text>
  <text x="1453" y="837" font-size="12" class="blue" font-weight="650">Atur →</text>

  <!-- Recent activity -->
  <rect x="74" y="900" width="1451" height="145" rx="10" class="card"/>
