    <text x="87" y="730" class="small muted">20°</text><text x="87" y="800" class="small muted">10°</text>
    <polyline points="120,684 175,678 230,691 285,669 340,666 395,675 450,655 505,662 560,670 615,650 670,646 725,659 780,648 835,637 890,642 950,624" fill="none" stroke="#c65d2e" stroke-width="3"/>
    <polyline points="120,625 175,632 230,618 285,621 340,629 395,615 450,619 505,605 560,614 615,618 670,603 725,612 780,608 835,595 890,601 950,590" fill="none" stroke="#2457d6" stroke-width="3"/>
    <polyline points="120,751 175,748 230,757 285,744 340,741 395,745 450,737 505,739 560,746 615,737 670,733 725,739 780,730 835,726 890,731 950,721" fill="none" stroke="#758c42" stroke-width="3"/>
    <path d="M120 745H950" fill="none" stroke="#758c42" stroke-width="1.5" stroke-dasharray="5 6" opacity=".7"/>
