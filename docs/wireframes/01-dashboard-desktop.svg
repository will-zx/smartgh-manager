<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe dashboard Smart Greenhouse — desktop</title>
  <desc id="desc">Konsep dashboard desktop dengan navigasi horizontal, metrik sensor, grafik iklim, dan kontrol perangkat.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #17232d; }
      .muted { fill: #64717b; } .blue { fill: #2457d6; } .orange { fill: #c65d2e; }
      .light { fill: #fffefa; }
      .small { font-size: 13px; } .label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .value { font-size: 30px; font-weight: 700; letter-spacing: -1px; }
      .title { font-size: 34px; font-weight: 650; letter-spacing: -1.2px; }
      .card { fill: #fffefa; stroke: #d9dedc; stroke-width: 1.5; }
      .rule { stroke: #e1e5e2; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f4f3ee"/>

  <rect width="1600" height="82" fill="#fffefa"/>
  <path d="M0 81.5H1600" class="rule"/>
  <text x="66" y="49" font-size="19" font-weight="800" letter-spacing="1.1">FIELDNOTE <tspan class="blue">/</tspan> GREENHOUSE</text>
  <text x="520" y="49" font-size="14" font-weight="650" class="blue">Ringkasan</text>
  <text x="640" y="49" font-size="14" font-weight="550" class="muted">Grafik</text>
  <text x="725" y="49" font-size="14" font-weight="550" class="muted">Perangkat</text>
  <text x="838" y="49" font-size="14" font-weight="550" class="muted">Riwayat</text>
  <rect x="1270" y="19" width="185" height="44" rx="8" fill="#f4f3ee" stroke="#d9dedc"/>
  <text x="1290" y="46" font-size="14" font-weight="650">Cabai Jawa</text>
  <path d="m1424 37 6 6 6-6" fill="none" stroke="#64717b" stroke-width="1.7"/>
  <circle cx="1490" cy="41" r="5" fill="#648646"/>
  <text x="1503" y="46" font-size="13" font-weight="650" fill="#405a2f">Terhubung</text>

  <text x="74" y="145" class="label blue">RUANG OPERASI / 01</text>
  <text x="74" y="192" class="title">Kontrol iklim rumah kaca</text>
  <text x="74" y="222" font-size="15" class="muted">Kondisi terkini dan respons perangkat · diperbarui 18 detik lalu</text>
  <rect x="1335" y="153" width="190" height="45" rx="8" fill="#17232d"/>
  <circle cx="1360" cy="175" r="5" fill="#b7dc83"/>
  <text x="1376" y="180" class="light" font-size="13" font-weight="650">SISTEM ONLINE</text>

