  <path d="M385 926V1018M745 926V1018M1105 926V1018" class="rule"/>
  <circle cx="420" cy="963" r="5" fill="#648646"/><text x="436" y="961" font-size="13" font-weight="700">Data sensor diterima</text><text x="436" y="984" class="small muted">18 detik lalu · semua probe aktif</text>
  <circle cx="780" cy="963" r="5" fill="#2457d6"/><text x="796" y="961" font-size="13" font-weight="700">Target fase diperbarui</text><text x="796" y="984" class="small muted">Vegetatif · VPD 1.00 kPa</text>
  <circle cx="1140" cy="963" r="5" fill="#c65d2e"/><text x="1156" y="961" font-size="13" font-weight="700">Misting aktif</text><text x="1156" y="984" class="small muted">Otomatis · mengikuti fuzzy</text>
