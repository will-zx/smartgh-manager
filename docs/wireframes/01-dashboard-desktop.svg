    <rect x="1273" y="584" width="154" height="38" rx="6" fill="#f4f3ee"/>
    <text x="1287" y="608" class="small muted">AUTO</text><rect x="1330" y="588" width="44" height="30" rx="5" fill="#2457d6"/><text x="1340" y="608" class="light" font-size="12" font-weight="700">ON</text><text x="1381" y="608" class="small muted">OFF</text>
