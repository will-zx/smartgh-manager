  <g>
    <rect x="74" y="255" width="278" height="145" rx="10" class="card"/>
    <text x="96" y="286" class="label muted">SUHU UDARA</text>
    <text x="96" y="340" class="value">25.1<tspan font-size="16" class="muted"> °C</tspan></text>
    <path d="M96 370h34" stroke="#c65d2e" stroke-width="3"/>
    <text x="142" y="375" class="small muted">stabil</text>

    <rect x="370" y="255" width="278" height="145" rx="10" class="card"/>
    <text x="392" y="286" class="label muted">KELEMBAPAN</text>
    <text x="392" y="340" class="value">68<tspan font-size="16" class="muted"> %</tspan></text>
    <path d="M392 370h34" stroke="#2457d6" stroke-width="3"/>
    <text x="438" y="375" class="small muted">udara</text>

    <rect x="666" y="255" width="278" height="145" rx="10" class="card"/>
    <text x="688" y="286" class="label muted">AIR TANAH</text>
    <text x="688" y="340" class="value">47<tspan font-size="16" class="muted"> %</tspan></text>
