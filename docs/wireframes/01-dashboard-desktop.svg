    <rect x="1273" y="736" width="154" height="38" rx="6" fill="#e8efd9"/>
    <text x="1287" y="760" font-size="12" font-weight="700" fill="#405a2f">AUTO</text><text x="1340" y="760" class="small muted">ON</text><text x="1385" y="760" class="small muted">OFF</text>
    <text x="1450" y="759" font-size="12" font-weight="700" class="muted">MATI</text>
