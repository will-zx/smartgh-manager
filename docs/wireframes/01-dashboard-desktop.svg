    <text x="1287" y="684" class="small muted">AUTO</text><text x="1340" y="684" class="small muted">ON</text><rect x="1375" y="664" width="44" height="30" rx="5" fill="#17232d"/><text x="1385" y="684" class="light" font-size="12" font-weight="700">OFF</text>
    <text x="1450" y="683" font-size="12" font-weight="700" class="muted">MATI</text>

    <circle cx="1052" cy="755" r="6" fill="#758c42"/>
