<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1600" viewBox="0 0 430 1600" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe dashboard Smart Greenhouse — mobile</title>
  <desc id="desc">Konsep dashboard mobile dengan navigasi tab atas, metrik, grafik, dan kontrol yang tersusun vertikal.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #17232d; }
      .muted { fill: #64717b; } .blue { fill: #2457d6; } .small { font-size: 12px; }
      .light { fill: #fffefa; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .card { fill: #fffefa; stroke: #d9dedc; stroke-width: 1.3; }
      .rule { stroke: #e1e5e2; stroke-width: 1; }
    </style>
  </defs>
  <rect width="430" height="1600" fill="#f4f3ee"/>
  <rect width="430" height="76" fill="#fffefa"/>
  <path d="M0 75.5H430" class="rule"/>
  <text x="20" y="35" font-size="15" font-weight="800" letter-spacing=".6">FIELDNOTE <tspan class="blue">/</tspan></text>
  <text x="20" y="57" font-size="12" font-weight="650">Cabai Jawa</text>
  <circle cx="330" cy="35" r="5" fill="#648646"/>
  <text x="342" y="40" font-size="11" font-weight="650" fill="#405a2f">LIVE</text>
  <rect x="388" y="22" width="24" height="24" rx="6" fill="#f4f3ee"/>
  <path d="M395 30h10M395 35h10M395 40h7" stroke="#17232d" stroke-width="1.5"/>

  <rect x="0" y="76" width="430" height="50" fill="#fffefa"/>
  <text x="20" y="107" font-size="12" font-weight="700" class="blue">Ringkasan</text>
  <text x="115" y="107" font-size="12" font-weight="600" class="muted">Grafik</text>
  <text x="180" y="107" font-size="12" font-weight="600" class="muted">Perangkat</text>
  <text x="276" y="107" font-size="12" font-weight="600" class="muted">Riwayat</text>
  <path d="M20 124h62" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M0 125.5H430" class="rule"/>

  <text x="20" y="161" class="label blue">RUANG OPERASI</text>
  <text x="20" y="197" font-size="27" font-weight="700" letter-spacing="-.8">Kondisi rumah kaca</text>
  <text x="20" y="221" font-size="13" class="muted">Data diterima 18 detik lalu</text>

  <!-- compact sensor summary -->
  <g>
    <rect x="20" y="245" width="188" height="112" rx="9" class="card"/>
    <text x="36" y="273" class="label muted">SUHU UDARA</text>
    <text x="36" y="317" font-size="28" font-weight="700">25.1<tspan font-size="14" class="muted"> °C</tspan></text>
    <path d="M36 337h25" stroke="#c65d2e" stroke-width="3"/>
    <rect x="222" y="245" width="188" height="112" rx="9" class="card"/>
    <text x="238" y="273" class="label muted">KELEMBAPAN</text>
    <text x="238" y="317" font-size="28" font-weight="700">68<tspan font-size="14" class="muted"> %</tspan></text>
    <path d="M238 337h25" stroke="#2457d6" stroke-width="3"/>

    <rect x="20" y="369" width="188" height="112" rx="9" class="card"/>
    <text x="36" y="397" class="label muted">AIR TANAH</text>
    <text x="36" y="438" font-size="28" font-weight="700">47<tspan font-size="14" class="muted"> %</tspan></text>
    <rect x="36" y="450" width="86" height="20" rx="4" fill="#e8efd9"/>
    <text x="46" y="464" font-size="10" font-weight="700" fill="#405a2f">3/3 PROBE</text>
    <rect x="222" y="369" width="188" height="112" rx="9" class="card"/>
    <text x="238" y="397" class="label muted">VPD</text>
    <text x="238" y="438" font-size="28" font-weight="700">1.24<tspan font-size="14" class="muted"> kPa</tspan></text>
    <text x="238" y="464" font-size="11" class="muted">Target 1.00 kPa</text>

    <rect x="20" y="493" width="390" height="95" rx="9" class="card"/>
    <text x="36" y="521" class="label muted">ETc HARIAN</text>
    <text x="36" y="563" font-size="26" font-weight="700">5.4<tspan font-size="13" class="muted"> mm/hari</tspan></text>
  </g>

  <!-- graph -->
  <rect x="20" y="610" width="390" height="335" rx="10" class="card"/>
  <text x="38" y="647" font-size="17" font-weight="700">Iklim mikro</text>
  <rect x="287" y="625" width="104" height="34" rx="6" fill="#f4f3ee"/>
  <text x="301" y="647" font-size="11" font-weight="700" class="blue">6 JAM</text>
  <text x="350" y="647" font-size="11" font-weight="600" class="muted">24J</text>
  <circle cx="43" cy="679" r="4" fill="#c65d2e"/><text x="54" y="684" class="small muted">Suhu</text>
  <circle cx="115" cy="679" r="4" fill="#2457d6"/><text x="126" y="684" class="small muted">RH</text>
  <circle cx="170" cy="679" r="4" fill="#758c42"/><text x="181" y="684" class="small muted">VPD</text>
  <path d="M44 724H389M44 776H389M44 828H389M44 880H389" class="rule"/>
  <path d="M44 710V900M130 710V900M216 710V900M302 710V900M389 710V900" class="rule"/>
  <polyline points="44,828 68,814 92,820 116,796 140,805 164,789 188,799 212,780 236,793 260,778 284,786 308,764 332,775 356,754 389,766" fill="none" stroke="#c65d2e" stroke-width="2.5"/>
  <polyline points="44,775 68,787 92,771 116,780 140,761 164,770 188,750 212,761 236,745 260,752 284,736 308,749 332,731 356,741 389,722" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <polyline points="44,868 68,864 92,871 116,858 140,861 164,852 188,856 212,845 236,850 260,840 284,844 308,830 332,835 356,824 389,829" fill="none" stroke="#758c42" stroke-width="2.5"/>
  <text x="44" y="925" class="small muted">08:00</text><text x="163" y="925" class="small muted">10:00</text>
  <text x="279" y="925" class="small muted">12:00</text><text x="355" y="925" class="small muted">14:00</text>

  <!-- control panel -->
  <rect x="20" y="965" width="390" height="412" rx="10" class="card"/>
  <text x="38" y="1002" font-size="17" font-weight="700">Kendali perangkat</text>
  <text x="38" y="1024" class="small muted">Status aktual · admin</text>
  <text x="390" y="1001" text-anchor="end" font-size="11" font-weight="700" class="blue">SEMUA AUTO</text>
  <path d="M38 1043H392" class="rule"/>
  <g>
    <text x="38" y="1074" font-size="14" font-weight="700">Misting</text><text x="38" y="1094" class="small muted">Aktif · manual</text>
    <rect x="230" y="1058" width="162" height="38" rx="6" fill="#f4f3ee"/>
    <text x="242" y="1082" font-size="11" class="muted">AUTO</text><rect x="286" y="1062" width="44" height="30" rx="5" fill="#2457d6"/><text x="296" y="1082" font-size="11" class="light" font-weight="700">ON</text><text x="342" y="1082" font-size="11" class="muted">OFF</text>
    <path d="M38 1111H392" class="rule"/>
    <text x="38" y="1142" font-size="14" font-weight="700">Blower</text><text x="38" y="1162" class="small muted">Duty 54% · mati</text>
    <rect x="230" y="1126" width="162" height="38" rx="6" fill="#f4f3ee"/>
    <text x="242" y="1150" font-size="11" class="muted">AUTO</text><text x="296" y="1150" font-size="11" class="muted">ON</text><rect x="342" y="1130" width="44" height="30" rx="5" fill="#17232d"/><text x="350" y="1150" font-size="11" class="light" font-weight="700">OFF</text>
    <path d="M38 1179H392" class="rule"/>
    <text x="38" y="1210" font-size="14" font-weight="700">Irigasi</text><text x="38" y="1230" class="small muted">Mati · otomatis</text>
    <rect x="230" y="1194" width="162" height="38" rx="6" fill="#e8efd9"/>
    <text x="242" y="1218" font-size="11" font-weight="700" fill="#405a2f">AUTO</text><text x="296" y="1218" font-size="11" class="muted">ON</text><text x="350" y="1218" font-size="11" class="muted">OFF</text>
  </g>
  <rect x="38" y="1254" width="354" height="94" rx="7" fill="#f4f3ee"/>
  <text x="54" y="1282" class="label muted">FASE TANAMAN</text>
  <text x="54" y="1312" font-size="16" font-weight="700">Vegetatif</text>
  <text x="54" y="1334" class="small muted">Target VPD <tspan font-weight="700" class="blue">1.00 kPa</tspan></text>

  <text x="20" y="1420" class="small muted">Data tersimpan di Firebase Realtime Database</text>
</svg>
